<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agro Phos India Limited — Product Catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Montserrat:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#123A22;
  --forest-deep:#0B2617;
  --leaf:#3E8E41;
  --leaf-light:#6FBE6E;
  --gold:#F2A93B;
  --gold-deep:#D98A1F;
  --soil:#6B4226;
  --ivory:#FBF7EE;
  --sky:#CFE9E6;
  --ink:#1C2B20;
  --paper-shadow: 0 18px 50px rgba(11,38,23,0.35);
}
*{box-sizing:border-box;}
html,body{
  margin:0;padding:0;height:100%;
  background:radial-gradient(ellipse at 50% 0%, #1c4a2c 0%, #0B2617 55%, #071C10 100%);
  font-family:'Montserrat',sans-serif;
  color:var(--ink);
  overflow-x:hidden;
}
.hindi{font-family:'Noto Sans Devanagari','Montserrat',sans-serif;}
h1,h2,h3,.display{font-family:'Poppins',sans-serif;}

/* ============ TOP BAR ============ */
.topbar{
  display:flex;align-items:center;justify-content:center;gap:14px;
  padding:22px 16px 6px;
  color:var(--ivory);
  text-align:center;
}
.topbar img{height:34px;width:auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));}
.topbar .brandline{font-family:'Poppins',sans-serif;font-weight:700;letter-spacing:.06em;font-size:15px;}
.topbar .brandline small{display:block;font-family:'Montserrat',sans-serif;font-weight:400;font-size:10px;letter-spacing:.2em;opacity:.7;}

/* ============ STAGE ============ */
.stage{
  display:flex;align-items:center;justify-content:center;
  padding:18px 12px 8px;
  perspective:2600px;
}
.book-wrap{
  position:relative;
  width:min(92vw, 760px);
  aspect-ratio: 3/4.05;
}
.hardcase{
  position:absolute;inset:-14px -14px -22px -14px;
  background:linear-gradient(160deg,#1a4a2c,#0c2a19 60%, #071c10);
  border-radius:22px;
  box-shadow:var(--paper-shadow), 0 2px 0 rgba(255,255,255,0.05) inset;
}
.spine{
  position:absolute;left:-2px;top:6px;bottom:14px;width:26px;
  background:linear-gradient(180deg,var(--soil),#3d2717);
  border-radius:10px 0 0 10px;
  box-shadow:inset -4px 0 10px rgba(0,0,0,.4);
  z-index:2;
}
.book{
  position:absolute;inset:0;
  transform-style:preserve-3d;
}
.page{
  position:absolute;inset:0;
  transform-style:preserve-3d;
  transform-origin:left center;
  transition:transform 900ms cubic-bezier(.61,.06,.36,1);
  will-change:transform;
  border-radius:4px 14px 14px 4px;
}
.page.flipped{transform:rotateY(-179.5deg);}
.face{
  position:absolute;inset:0;
  backface-visibility:hidden;
  border-radius:4px 14px 14px 4px;
  overflow:hidden;
  background:var(--ivory);
  box-shadow: 6px 0 24px rgba(0,0,0,.18);
}
.face.back{
  transform:rotateY(180deg);
  background:
    repeating-linear-gradient(115deg, rgba(62,142,65,0.05) 0 2px, transparent 2px 6px),
    linear-gradient(135deg,#fbf7ee,#f1ead9);
  display:flex;align-items:center;justify-content:center;
}
.face.back .wm{
  width:38%;opacity:.14;filter:grayscale(1) brightness(0.4);
}
.page .curl{
  position:absolute;inset:0;
  background:linear-gradient(90deg, rgba(0,0,0,0) 78%, rgba(0,0,0,0.18) 92%, rgba(0,0,0,0.32) 100%);
  opacity:0;pointer-events:none;
  transition:opacity 900ms ease;
}
.page.flipping .curl{opacity:1;}
.page.flipped .curl{opacity:0;}

/* leaf/paper texture on all faces */
.paper-tex{
  position:absolute;inset:0;pointer-events:none;
  background-image: radial-gradient(circle at 20% 15%, rgba(255,255,255,.5), transparent 40%);
  mix-blend-mode:overlay; opacity:.5;
}

/* ============ PAGE CONTENT COMMON ============ */
.pg{position:absolute;inset:0;padding:5.5% 6%;display:flex;flex-direction:column;}
.leafbg{
  position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(circle at 92% 6%, rgba(63,142,65,.10), transparent 40%),
   radial-gradient(circle at 4% 96%, rgba(242,169,59,.10), transparent 42%);
}
.leafbg svg{position:absolute;opacity:.10;}
.pageno{
  position:absolute;bottom:14px;right:22px;
  font-family:'Poppins',sans-serif;font-weight:700;font-size:12px;color:var(--forest);opacity:.45;
  z-index:2;
}

/* ============ COVER PAGE ============ */
.cover{
  background:
    radial-gradient(ellipse at 30% 10%, rgba(255,255,255,.10), transparent 55%),
    linear-gradient(150deg,#1c4d2d 0%, #0e3320 45%, #0a2416 100%);
  color:var(--ivory);
  position:relative;
  align-items:center;text-align:center;justify-content:space-between;
}
.cover .deco-wheat{position:absolute;bottom:0;left:0;right:0;height:34%;opacity:.9;pointer-events:none;}
.cover .logos{display:flex;align-items:center;gap:12px;justify-content:center;z-index:2;}
.cover .logos img{height:38px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));}
.cover .logos .div{width:1px;height:24px;background:rgba(255,255,255,.3);}
.cover .titleblock{z-index:2;margin-top:6%;}
.cover .eyebrow{
  font-size:11px;letter-spacing:.35em;font-weight:600;color:var(--gold);
  margin-bottom:10px;text-transform:uppercase;
}
.cover h1{
  font-size:clamp(26px,6.4vw,42px);font-weight:900;line-height:1.05;margin:0 0 6px;
  letter-spacing:.01em;
  text-shadow:0 4px 18px rgba(0,0,0,.35);
}
.cover h1 span{color:var(--gold);}
.cover .sub{font-size:clamp(12px,2.6vw,15px);font-weight:500;opacity:.92;margin-bottom:14px;}
.cover .hin{font-size:clamp(16px,3.4vw,21px);font-weight:700;margin:10px 0 2px;}
.cover .hin2{font-size:clamp(11px,2.4vw,13px);opacity:.85;}
.cover .badge-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px;z-index:2;}
.cover .badge{
  font-size:10px;font-weight:600;letter-spacing:.04em;
  border:1px solid rgba(242,169,59,.55);color:var(--gold);
  padding:5px 11px;border-radius:20px;background:rgba(242,169,59,.08);
}
.cover .bottom-slogan{
  z-index:2;font-family:'Noto Sans Devanagari';font-weight:700;
  font-size:clamp(13px,2.8vw,16px);color:var(--ivory);
  border-top:1px solid rgba(255,255,255,.18);padding-top:12px;margin-top:10px;width:100%;
}
.cover .bottom-slogan small{display:block;font-family:'Montserrat';font-weight:400;font-size:9px;letter-spacing:.2em;color:var(--gold);margin-top:4px;text-transform:uppercase;}

/* ============ PRODUCT PAGES ============ */
.pg-head{z-index:2;text-align:center;margin-bottom:3%;}
.pg-head .eyebrow{
  font-size:9px;letter-spacing:.3em;color:var(--leaf);font-weight:700;text-transform:uppercase;
}
.pg-head h2{font-size:clamp(18px,3.6vw,26px);color:var(--forest);margin:2px 0 0;font-weight:800;}
.pg-head .rule{width:46px;height:3px;background:var(--gold);margin:8px auto 0;border-radius:3px;}

.grid{z-index:2;flex:1;display:grid;gap:4%;align-content:center;}
.grid.g2{grid-template-columns:repeat(2,1fr);}
.grid.g3{grid-template-columns:repeat(3,1fr);}

.card{
  position:relative;
  background:linear-gradient(180deg,#ffffff,#f7fbf3);
  border:1px solid rgba(62,142,65,.25);
  border-radius:16px;
  padding:8% 6% 9%;
  display:flex;flex-direction:column;align-items:center;
  box-shadow:0 8px 22px rgba(18,58,34,.10);
  transition:transform .35s ease, box-shadow .35s ease;
}
.card:hover{transform:translateY(-5px);box-shadow:0 16px 30px rgba(18,58,34,.18);}
.card .imgwrap{
  width:100%;aspect-ratio:1/1.12;display:flex;align-items:center;justify-content:center;
  margin-bottom:8%;
}
.card img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.16));}
.card .pname{
  font-family:'Poppins',sans-serif;font-weight:700;font-size:clamp(10px,1.6vw,13px);
  text-align:center;color:var(--forest);line-height:1.25;
}
.card .ptag{
  font-size:9px;color:var(--soil);font-weight:600;letter-spacing:.03em;margin-top:3px;text-align:center;
}

/* ============ CLOSING PAGE ============ */
.closing{color:var(--forest);}
.closing .grid2{display:grid;grid-template-columns:1fr 1fr;gap:5%;z-index:2;margin-top:2%;}
.closing .box{
  background:linear-gradient(180deg,#ffffff,#f6fbf1);
  border:1px solid rgba(62,142,65,.22);border-radius:14px;padding:10px 12px;
}
.closing .box h3{
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--leaf);
  margin:0 0 6px;font-weight:700;
}
.closing .box p{font-size:clamp(9px,1.8vw,11px);line-height:1.5;margin:0;color:#233;}
.closing .highlights{
  display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4% 0;z-index:2;
}
.closing .hchip{
  background:var(--forest);color:var(--ivory);font-size:9px;font-weight:600;
  padding:5px 10px;border-radius:20px;letter-spacing:.02em;
}
.closing .contact-row{
  z-index:2;margin-top:auto;
  display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
  border-top:1px solid rgba(107,66,38,.2);padding-top:10px;
}
.closing .contact-row .c-left{font-size:9.5px;line-height:1.7;color:var(--forest);}
.closing .contact-row .c-left b{display:block;font-family:'Poppins';font-size:12px;color:var(--forest);}
.closing .qr{
  width:58px;height:58px;border-radius:8px;border:2px dashed var(--leaf);
  display:flex;align-items:center;justify-content:center;font-size:7px;text-align:center;color:var(--leaf);font-weight:700;flex-shrink:0;
}
.closing .thankyou{
  text-align:center;z-index:2;margin:2% 0 1%;
}
.closing .thankyou h2{font-size:clamp(18px,3.6vw,24px);color:var(--forest);margin:0;font-weight:800;}
.closing .thankyou .hin{font-family:'Noto Sans Devanagari';font-weight:700;font-size:clamp(13px,2.6vw,16px);color:var(--gold-deep);margin-top:2px;}

/* ============ NAV HOTZONES ============ */
.hotzone{position:absolute;top:0;bottom:0;width:38%;z-index:40;cursor:pointer;}
.hotzone.right{right:0;}
.hotzone.left{left:0;}

/* ============ CONTROLS ============ */
.controls{
  display:flex;align-items:center;justify-content:center;gap:14px;
  padding:14px 10px 30px;color:var(--ivory);flex-wrap:wrap;
}
.controls button{
  font-family:'Poppins',sans-serif;font-weight:600;font-size:12px;
  background:linear-gradient(180deg,var(--gold),var(--gold-deep));
  color:#3a2604;border:none;padding:9px 16px;border-radius:24px;cursor:pointer;
  box-shadow:0 4px 10px rgba(0,0,0,.3);
  transition:transform .15s ease;
}
.controls button:hover{transform:translateY(-2px);}
.controls button:disabled{opacity:.35;cursor:default;transform:none;}
.controls .ghost{
  background:transparent;border:1px solid rgba(255,255,255,.4);color:var(--ivory);
  box-shadow:none;
}
.dots{display:flex;gap:6px;align-items:center;}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer;transition:.25s;}
.dot.active{background:var(--gold);width:20px;border-radius:5px;}
.hint{
  text-align:center;color:rgba(255,255,255,.55);font-size:11px;margin-top:-6px;padding-bottom:14px;
}

/* ============ RESPONSIVE ============ */
@media (max-width:560px){
  .grid.g3{grid-template-columns:repeat(2,1fr);}
  .closing .grid2{grid-template-columns:1fr;}
  .card{padding:9% 7% 10%;}
  .topbar .brandline{font-size:12px;}
}

/* ============ PRINT ============ */
@media print{
  html,body{background:#fff !important;}
  .topbar,.controls,.hint,.hotzone,.hardcase,.spine{display:none !important;}
  .stage{padding:0;perspective:none;}
  .book-wrap{width:210mm;aspect-ratio:auto;position:static;}
  .book{position:static;}
  .page{
    position:relative;transform:none !important;transition:none !important;
    page-break-after:always;width:210mm;height:297mm;
  }
  .face{position:relative;box-shadow:none;border-radius:0;}
  .face.back{display:none;}
  .curl{display:none;}
}
</style>
</head>
